name: Render Keep-Alive Cron

on:
  schedule:
    # Runs every 10 minutes (* is minute, hour, day, month, day-of-week)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping FitFlow Render Service
        env:
          SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL || 'https://gyminhand.onrender.com' }}
        run: |
          echo "Pinging $SERVICE_URL/api/health at $(date)"
          curl -f -s -S "$SERVICE_URL/api/health" || echo "Ping completed with warning"
